
name: PYHUNTER Crawler

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain yang diizinkan untuk dicrawl"
        required: true
        type: string

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run crawler
        env:
          TARGET_DOMAIN: ${{ inputs.domain }}
        run: python run_crawl.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Update crawling results" || echo "No changes"
          git push
